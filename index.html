<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bijay Simkhada | CLI Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0d1117;
      font-family: 'Fira Code', monospace;
      color: #c9d1d9;
    }

    .terminal {
      max-width: 900px;
      margin: 24px auto;
      padding: 24px;
      background: #010409;
      border-radius: 8px;
      box-shadow: 0 0 40px rgba(0,0,0,0.9);
      min-height: 90vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ===== PROFILE ===== */
    .profile {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid #21262d;
    }

    .profile img {
      width: 80px;
      height: 80px;
      border-radius: 6px;
      object-fit: cover;
      box-shadow: 0 0 12px rgba(0,0,0,0.6);
    }

    .profile-info strong {
      font-size: 1.1rem;
      color: #7ee787;
    }

    .profile-info div {
      font-size: 0.9rem;
      color: #8b949e;
    }

    /* ===== OUTPUT ===== */
    #output {
      flex: 1;
      overflow-y: auto;
      padding-right: 6px;
      padding-bottom: 20px;
    }

    .prompt {
      color: #58a6ff;
      white-space: pre-wrap;
      margin-top: 10px;
    }

    .output {
      white-space: pre-wrap;
      margin-left: 14px;
      margin-bottom: 10px;
    }

    .error {
      color: #f85149;
      margin-left: 14px;
    }

    /* ===== PROJECT ===== */
    .project {
      margin-left: 14px;
      margin-bottom: 24px;
    }

    .project img {
      width: 140px;
      border-radius: 6px;
      margin: 10px 0;
      display: block;
      box-shadow: 0 0 10px rgba(0,0,0,0.6);
    }

    /* ===== STICKY INPUT ===== */
    .input-line {
      display: flex;
      align-items: center;
      gap: 6px;
      position: sticky;
      bottom: 0;
      z-index: 10;
      padding-top: 12px;
      margin-top: 10px;
      background: #010409;
      border-top: 1px solid #21262d;
    }

    .input-line span {
      color: #58a6ff;
      white-space: nowrap;
    }

    input {
      background: transparent;
      border: none;
      outline: none;
      color: #7ee787;
      font-family: inherit;
      font-size: 1rem;
      width: 100%;
      caret-color: #c9d1d9;
    }

    a {
      color: #58a6ff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

<div class="terminal">
  <!-- PROFILE -->
  <div class="profile">
    <img src="assets/me.jpg" alt="Bijay Simkhada" />
    <div class="profile-info">
      <strong>Bijay Simkhada</strong>
      <div>Web & Flutter Developer</div>
      <div>Nepal 🇳🇵</div>
    </div>
  </div>

  <!-- OUTPUT -->
  <div id="output"></div>

  <!-- STICKY INPUT -->
  <div class="input-line">
    <span>bijay@portfolio:~$</span>
    <input id="commandInput" autofocus />
  </div>
</div>

<script>
  const output = document.getElementById("output");
  const input = document.getElementById("commandInput");

  function scrollToBottom() {
    requestAnimationFrame(() => {
      output.scrollTop = output.scrollHeight;
    });
  }

  function printPrompt(cmd) {
    const div = document.createElement("div");
    div.className = "prompt";
    div.textContent = `bijay@portfolio:~$ ${cmd}`;
    output.appendChild(div);
    scrollToBottom();
  }

  function print(text, className = "output") {
    const div = document.createElement("div");
    div.className = className;
    div.textContent = text;
    output.appendChild(div);
    scrollToBottom();
  }

  function printHTML(html) {
    const div = document.createElement("div");
    div.className = "output";
    div.innerHTML = html;
    output.appendChild(div);

    const imgs = div.querySelectorAll("img");
    if (imgs.length) {
      imgs.forEach(img => {
        img.onload = scrollToBottom;
      });
    }

    scrollToBottom();
  }

  const commands = {
    help() {
      print(`
Available commands:
  whoami
  about
  skills
  projects
  contact
  clear
`);
    },

    whoami() {
      print(`
Bijay Simkhada
Web & Flutter Developer
`);
    },

    about() {
      print(`
I love building clean and scalable
web & mobile applications.
Always learning. Always shipping.
`);
    },

    skills() {
      print(`
HTML, CSS, JavaScript
Flutter, Dart
Firebase, REST APIs
Git, GitHub
`);
    },

    projects() {
      printHTML(`
<div class="project">
  <strong>DocPrep</strong> — Medical Entrance Prep App
  <img src="https://play-lh.googleusercontent.com/BmVrp-6ZCNjr31gHQvCOGUyfpTQ96bPKeji8Y3V2huIh6_8FxhEOaghP-40THqeHzNQ=w240-h480-rw">
  <a href="https://play.google.com/store/apps/details?id=com.ktmbees.docprep" target="_blank">
    View on Play Store
  </a>
</div>

<div class="project">
  <strong>Tolka</strong> — Learn German App
  <img src="https://play-lh.googleusercontent.com/SR70SUdP21e4mczqA-2RuWde9z5LUHTkYd_6tl3uziqy0Gqj8b8wsxq3iYS7Yv83Atwa=w240-h480-rw">
  <a href="https://play.google.com/store/apps/details?id=com.ktmbees.tolka" target="_blank">
    View on Play Store
  </a>
</div>
`);
    },

    contact() {
      print(`
Email   : bijaysimkhada5@gmail.com
GitHub  : github.com/BijaySimkhada
LinkedIn: linkedin.com/in/bijay-simkhada-3b26141b4
`);
    }
  };

  function runCommand(cmd) {
    printPrompt(cmd);

    if (cmd === "clear") {
      output.innerHTML = "";
      return;
    }

    if (commands[cmd]) {
      commands[cmd]();
    } else {
      print(`command not found: ${cmd}`, "error");
    }
  }

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      const cmd = input.value.trim();
      if (cmd) runCommand(cmd);
      input.value = "";
    }
  });

  window.addEventListener("click", () => input.focus());

  // Boot message
  print("Welcome to Bijay's Portfolio CLI");
  print("Type `help` to get started.\n");
</script>

</body>
</html>
